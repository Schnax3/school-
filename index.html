<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Never Gonna Give You Up 🎵</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #2b1055, #0f0c29);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;
    overflow: hidden;
    text-align: center;
    padding: 20px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 5px;
    text-shadow: 0 0 15px #ff4fd8;
  }

  p.sub {
    opacity: 0.7;
    margin-top: 0;
    margin-bottom: 30px;
  }

  .stage {
    position: relative;
    width: 320px;
    height: 320px;
  }

  .record {
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center,
        #111 0px, #111 3px,
        #1c1c1c 4px, #1c1c1c 6px);
    box-shadow: 0 0 40px rgba(255, 79, 216, 0.5), inset 0 0 20px #000;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: spin 3s linear infinite;
    animation-play-state: paused;
    cursor: pointer;
  }

  .record.spinning {
    animation-play-state: running;
  }

  .label {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff4fd8, #7b2ff7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
    padding: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.6);
  }

  .label::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    background: #0f0c29;
    border-radius: 50%;
  }

  .tonearm {
    position: absolute;
    top: -20px;
    right: -40px;
    width: 140px;
    height: 140px;
    transform-origin: top right;
    transform: rotate(-25deg);
    transition: transform 0.6s ease;
    pointer-events: none;
  }

  .tonearm.down {
    transform: rotate(5deg);
  }

  .tonearm svg { width: 100%; height: 100%; }

  .hint {
    margin-top: 30px;
    font-size: 0.95rem;
    opacity: 0.8;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .video-wrap {
    margin-top: 30px;
    max-width: 560px;
    width: 90vw;
    display: none;
  }

  .video-wrap.show {
    display: block;
  }

  .video-wrap video,
  .video-wrap img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    border: 3px solid #ff4fd8;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(255, 79, 216, 0.6);
    background: #000;
    pointer-events: none;
  }

  .video-wrap img {
    display: none;
  }

  .video-wrap.show-image video {
    display: none;
  }

  .video-wrap.show-image img {
    display: block;
  }

  .notes {
    position: fixed;
    font-size: 24px;
    opacity: 0;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-200px) rotate(30deg); opacity: 0; }
  }

  .debug {
    display: none;
    position: fixed;
    bottom: 10px;
    left: 10px;
    right: 10px;
    max-width: 500px;
    max-height: 40vh;
    overflow-y: auto;
    background: rgba(0,0,0,0.85);
    border: 1px solid #ff4fd8;
    border-radius: 8px;
    padding: 10px 14px;
    font-family: monospace;
    font-size: 12px;
    text-align: left;
    color: #9effc4;
    z-index: 999;
  }

  .debug.visible {
    display: block;
  }

  .debug h3 {
    margin: 0 0 6px 0;
    color: #ff4fd8;
    font-size: 13px;
  }

  .debug .line {
    white-space: pre-wrap;
    word-break: break-all;
    margin: 2px 0;
  }

  .debug .err {
    color: #ff6b6b;
  }

  .debug .ok {
    color: #9effc4;
  }
</style>
</head>
<body>

  <h1>🎶 Leg die Platte auf 🎶</h1>
  <p class="sub">Klick auf die Schallplatte, um sie abzuspielen...</p>

  <div class="stage">
    <div class="record" id="record">
      <div class="label">PLAY<br>ME</div>
    </div>
    <div class="tonearm" id="tonearm">
      <svg viewBox="0 0 140 140">
        <line x1="130" y1="10" x2="30" y2="100" stroke="#ddd" stroke-width="6" stroke-linecap="round"/>
        <circle cx="130" cy="10" r="10" fill="#ccc"/>
        <circle cx="30" cy="100" r="6" fill="#ff4fd8"/>
      </svg>
    </div>
  </div>

  <p class="hint" id="hint">👆 Klick mich an</p>

  <div class="video-wrap" id="videoWrap">
    <video id="ytFrame" playsinline disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen" tabindex="-1" oncontextmenu="return false">
      <source src="v.mp4" type="video/mp4">
      Dein Browser kann dieses Video leider nicht abspielen.
    </video>
    <img id="imgFrame" src="" alt="Bild">
  </div>

  <div class="debug" id="debug">
    <h3>🐞 Debug</h3>
    <div id="debugLines"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAmgP26BpQsBi9YvCEz-T6P3StlY-fJyjg",
    authDomain: "clenda.firebaseapp.com",
    databaseURL: "https://clenda-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "clenda",
    storageBucket: "clenda.firebasestorage.app",
    messagingSenderId: "62584430291",
    appId: "1:62584430291:web:527b348a4b041e16c9be26"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const debugPanel = document.getElementById('debug');
  const debugLines = document.getElementById('debugLines');

  function log(msg, type = 'ok') {
    console.log('[Rickroll-Debug]', msg);
    const div = document.createElement('div');
    div.className = 'line ' + (type === 'err' ? 'err' : 'ok');
    const time = new Date().toLocaleTimeString('de-DE');
    div.textContent = `[${time}] ${msg}`;
    debugLines.appendChild(div);
    debugLines.parentElement.scrollTop = debugLines.parentElement.scrollHeight;
  }

  log('Firebase App initialisiert (projectId: ' + firebaseConfig.projectId + ')');

  // Konfiguration in der Realtime Database unter dem Pfad "config":
  //   config/randomEnabled  -> true/false, ob überhaupt zufällig gewählt wird
  //   config/videoChance    -> Zahl zwischen 0 und 1, Chance für das Video (Rest = Bild)
  //   config/imageUrl       -> Pfad ODER volle URL (https://...) zum Bild
  //   config/debug          -> true/false, ob das Debug-Panel unten links angezeigt wird
  //
  // Fehlt "config" ganz, oder randomEnabled = false, wird immer das Video gezeigt.
  async function loadConfig() {
    const fallback = { randomEnabled: false, videoChance: 0.5, imageUrl: 'bild.jpg', debug: false };
    log('Lade Konfiguration von: ' + firebaseConfig.databaseURL + '/config.json');
    try {
      const snap = await get(ref(db, 'config'));
      if (snap.exists()) {
        const merged = { ...fallback, ...snap.val() };
        log('Konfiguration geladen: ' + JSON.stringify(merged));
        return merged;
      } else {
        log('Kein "config"-Knoten in der Datenbank gefunden -> benutze Fallback: ' + JSON.stringify(fallback), 'err');
      }
    } catch (err) {
      log('Fehler beim Laden der Konfiguration: ' + err.message + ' -> benutze Fallback', 'err');
    }
    return fallback;
  }

  // Config wird sofort beim Laden der Seite geholt, damit debug=true das
  // Panel schon vor dem Klick zeigt. Das gleiche Ergebnis wird beim Klick
  // wiederverwendet (kein zweiter Request nötig).
  const configPromise = loadConfig().then(config => {
    if (config.debug) {
      debugPanel.classList.add('visible');
      log('Debug-Modus ist AKTIV (config/debug = true)');
    }
    return config;
  });

  const record = document.getElementById('record');
  const tonearm = document.getElementById('tonearm');
  const hint = document.getElementById('hint');
  const videoWrap = document.getElementById('videoWrap');
  const videoEl = document.getElementById('ytFrame');
  const imgEl = document.getElementById('imgFrame');

  // Video darf nicht pausiert werden: jeder Pause-Versuch (Leertaste,
  // Tab-Wechsel, DevTools, etc.) wird sofort wieder rückgängig gemacht.
  videoEl.addEventListener('pause', () => {
    if (!videoEl.ended) {
      log('Pause-Versuch erkannt -> Video wird fortgesetzt');
      videoEl.play().catch(() => {});
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && videoWrap.classList.contains('show') && !videoWrap.classList.contains('show-image')) {
      videoEl.play().catch(() => {});
    }
  });
  document.addEventListener('keydown', (e) => {
    if ([' ', 'k', 'K', 'ArrowLeft', 'ArrowRight'].includes(e.key) && videoWrap.classList.contains('show')) {
      e.preventDefault();
    }
  });

  let played = false;

  record.addEventListener('click', async () => {
    if (played) return;
    played = true;

    record.classList.add('spinning');
    tonearm.classList.add('down');
    hint.style.display = 'none';

    log('Platte angeklickt, starte Entscheidung...');

    // ein paar Noten fliegen lassen
    for (let i = 0; i < 12; i++) {
      setTimeout(spawnNote, i * 150);
    }

    const config = await configPromise;
    const roll = Math.random();
    const showVideo = !config.randomEnabled || roll < config.videoChance;
    log(`Zufallswert: ${roll.toFixed(3)} | randomEnabled: ${config.randomEnabled} | videoChance: ${config.videoChance} -> Entscheidung: ${showVideo ? 'VIDEO' : 'BILD'}`);

    setTimeout(() => {
      if (showVideo) {
        videoWrap.classList.remove('show-image');
        videoEl.play().then(() => {
          log('Video wird abgespielt (v.mp4)');
        }).catch(err => {
          log('Video konnte nicht automatisch starten: ' + err.message, 'err');
        });
      } else {
        const url = config.imageUrl;
        log('Setze Bild-Quelle auf: ' + url);
        imgEl.onload = () => log('Bild erfolgreich geladen: ' + url);
        imgEl.onerror = () => log('Bild konnte NICHT geladen werden (falscher Link, CORS oder Datei fehlt): ' + url, 'err');
        imgEl.src = url;
        videoWrap.classList.add('show-image');
      }
      videoWrap.classList.add('show');
      videoWrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 600);
  });

  function spawnNote() {
    const note = document.createElement('div');
    note.className = 'notes';
    note.textContent = ['🎵','🎶','🎼'][Math.floor(Math.random()*3)];
    const rect = record.getBoundingClientRect();
    note.style.left = (rect.left + rect.width/2 + (Math.random()*100-50)) + 'px';
    note.style.top = (rect.top + rect.height/2) + 'px';
    note.style.animation = 'floatUp 1.5s ease-out forwards';
    document.body.appendChild(note);
    setTimeout(() => note.remove(), 1500);
  }
</script>

</body>
</html>
